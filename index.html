<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kamer Can</title>
    <meta name="description" content="Kamer Can: computer engineering student at YTU, co-founder of Haneko. Software, guitar, design, games and the CASMarine underwater vehicle." />
    <meta name="theme-color" content="#E9E7DC" />
    <meta property="og:title" content="Kamer Can" />
    <meta property="og:description" content="Software, music, design, games, a startup and an underwater vehicle." />
    <meta property="og:image" content="/media/og.jpg" />
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip" href="#about">Skip to content</a>
    <!-- Kamer's own logo gradient (kamer-logo-mark-light.svg) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="kmetal" gradientUnits="userSpaceOnUse" x1="10" y1="6" x2="54" y2="58">
          <stop offset="0" stop-color="#9a9fa8" />
          <stop offset="0.45" stop-color="#5a5e67" />
          <stop offset="1" stop-color="#2a2c31" />
        </linearGradient>
        <filter id="kshadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" />
          <feOffset dy="1.6" result="blur" />
          <feFlood flood-color="#000000" flood-opacity="0.35" />
          <feComposite in2="blur" operator="in" />
          <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="scribble" x="-5%" y="-20%" width="110%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="6" />
        </filter>
      </defs>
    </svg>

    <header class="bar" id="bar">
      <a class="brand" href="#hero" aria-label="Kamer Can, back to the top">
        <svg class="mark" viewBox="13 5 38 53" aria-hidden="true">
          <circle cx="32" cy="42" r="12.5" fill="none" stroke="url(#kmetal)" stroke-width="3.4" />
          <path d="M19.39 40.38 L32 9 L44.61 40.38" fill="none" stroke="url(#kmetal)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Kamer Can</span>
      </a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <button class="nav-menu" id="btn-menu" aria-expanded="false" aria-controls="menu">Sections</button>
    </header>

    <nav id="menu" aria-label="Sections" hidden>
      <ol id="menu-list"></ol>
    </nav>

    <main>
      <section id="hero" class="hero">
        <div class="ld-top">
          <div class="ld-text">
            <p class="ld-blurb"><em>Hey, I’m Kamer.</em> I study computer engineering; I write code, play guitar, make design and games. It’s all down here.</p>
          </div>
          <div class="ld-right">
            <svg class="ld-arrow" viewBox="0 0 800 200" fill="none" aria-hidden="true">
              <path class="ld-arrow-line" pathLength="1" d="M10 22 C 60 50, 110 66, 150 70 C 175 72, 178 50, 160 48 C 140 46, 138 70, 152 92 C 180 130, 300 150, 450 160 C 600 168, 700 160, 770 118" />
              <path class="ld-arrow-head" pathLength="1" d="M728 112 L772 114 L790 148" />
            </svg>
            <button class="hero-enter"><span>get to know me</span></button>
          </div>
        </div>
        <div class="hero-hang" id="hero-hang" aria-hidden="true"></div>
        <h1 class="ld-word" aria-label="Kamer"><span>K</span><span>a</span><span>m</span><span>e</span><span>r</span></h1>
      </section>

      <div id="sections"></div>

      <footer class="foot" id="contact">
        <div class="foot-head">
          <p class="sec-kicker"><b>~</b>Contact</p>
          <h2 class="sec-title">Find <em>me</em> here.</h2>
        </div>
        <div class="tags-rail"><span class="rail-rod"></span><div class="tags-row" id="tags"></div></div>
        <p class="foot-copy">© 2026 Kamer Can</p>
      </footer>
    </main>

    <div id="lightbox" hidden>
      <figure><img alt="" /><figcaption></figcaption></figure>
      <button class="lb-close" aria-label="Close"><span></span><span></span></button>
    </div>

    <script type="module" src="/src/site.js"></script>
  </body>
</html>
