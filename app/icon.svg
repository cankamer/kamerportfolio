<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9dbe0"/>
      <stop offset="1" stop-color="#9ea2aa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0c"/>
  <!-- ring -->
  <circle cx="32" cy="42" r="12.5" fill="none" stroke="url(#silver)" stroke-width="3.4"/>
  <!-- open triangle (no base); the outer edges of both bars are tangent to the
       ring's outer edge. Casts a shadow onto the ring. -->
  <path d="M19.39 40.38 L32 9 L44.61 40.38" fill="none" stroke="url(#silver)" stroke-width="3.8"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
